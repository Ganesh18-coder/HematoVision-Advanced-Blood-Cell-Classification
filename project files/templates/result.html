<!DOCTYPE html>
<html>
<head>
    <title>Prediction Result</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f2f2f2;
        }

        .container {
            margin-top: 50px;
        }

        h1 {
            color: #e74c3c;
        }

        img {
            margin-top: 20px;
            border-radius: 10px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #e74c3c;
            color: white;
            text-decoration: none;
        }

        a:hover {
            background-color: #c0392b;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Prediction Result</h1>

    <h2>Predicted Class: {{ class_label }}</h2>

    <img src="data:image/png;base64,{{ img_data }}" width="300">

    <br>
    <a href="/">Upload Another Image</a>
</div>

</body>
</html>
