<!DOCTYPE html>
<html>
<head>
    <title>HematoVision</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f2f2f2;
        }

        .container {
            margin-top: 100px;
        }

        h1 {
            color: #e74c3c;
        }

        input[type=file] {
            margin: 20px;
        }

        button {
            padding: 10px 20px;
            background-color: #e74c3c;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #c0392b;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>HematoVision - Blood Cell Classification</h1>

    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="file" required>
        <br>
        <button type="submit">Predict</button>
    </form>
</div>

</body>
</html>
